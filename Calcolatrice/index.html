<!DOCTYPE html>
<html>
    <head> 
        <meta author="IftuRahman">
        <title> De Calculador </title>
        <link rel="stylesheet" href="css/style.css">
        
    </head>

    <body>
        <header>
            DE CALCULADOR
        </header>

        <div class="calcolatrice">
            <div class="calc">
                <div class="display" id="display"></div>

                <div class="buttons">
                    <button id="esponente"> ^ </button>
                    <button id="clear"> C </button>
                    <button id="delete"> DEL </button>
                    <button id="divisione"> / </button>
                </div>
                <div class="buttons">
                    <button id="sette"> 7 </button>
                    <button id="otto"> 8 </button>
                    <button id="nove"> 9 </button>
                    <button id="moltiplica"> * </button>
                </div>
                <div class="buttons">
                    <button id="quattro"> 4 </button>
                    <button id="cinque"> 5 </button>
                    <button id="sei"> 6 </button>
                    <button id="sottrai"> - </button>
                </div>
                <div class="buttons">
                    <button id="uno"> 1 </button>
                    <button id="due"> 2 </button>
                    <button id="tre"> 3 </button>
                    <button id="aggiungi"> + </button>
                </div>
                <div class="buttons">
                    <button id="posneg"> +- </button>
                    <button id="zero"> 0 </button>
                    <button id="punto"> . </button>
                    <button id="uguale"> = </button>
                </div>
                


            </div>
            <div class="cron">
                <h2> Cronologia </h2>
                <div id="cronologia">
                    
                </div>

            </div>
        </div>

        <footer> 
            Progetto di scopo didattico (2026)
        </footer>

        <script src="js/main.js"></script>
    </body>
</html>
